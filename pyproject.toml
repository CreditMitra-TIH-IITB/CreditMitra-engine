[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditmitra-engine"
version = "1.0.0"
description = "Bank-statement analysis pipeline — PDF extraction, transaction enrichment via Ollama LLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "CreditMitra Team" },
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.9",
    "anyio>=4.0.0",
    "docling>=1.0.0",
    # Fallback table extraction when Docling fails on a PDF
    "pdfplumber>=0.11.0",
    # Merchant classification (ONNX pipeline)
    "onnxruntime>=1.17.0",
    "transformers>=4.40.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Enrichment tier 3 (local LLM). Imported lazily, so the engine runs without it.
llm = [
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
]
# Lint/type tools are pinned exactly: with floating versions CI silently picks
# up a newer ruff or mypy than anyone ran locally, and the build goes red on a
# reformat or an "unused type: ignore" that no developer can reproduce.
dev = [
    "ruff==0.15.20",
    "mypy==2.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "pre-commit>=3.6.0",
]

# ─── Tools ────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
# Newer ruff versions format fenced code blocks inside Markdown. agents.md and
# the READMEs hold illustrative, sometimes deliberately partial snippets, so
# keep the formatter off documentation entirely rather than letting a ruff
# upgrade rewrite prose examples.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# transformers' typing coverage varies by release, so AutoTokenizer.from_pretrained
# reads as untyped on some versions and typed on others. Exempting the one module
# that touches it keeps strict mode everywhere else without a version-fragile
# inline ignore.
[[tool.mypy.overrides]]
module = "app.services.merchant_classifier"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
